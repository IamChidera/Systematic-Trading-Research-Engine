<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Systematic Trading Research Engine architecture</title><desc id="desc">Four layers from market data through research and portfolios to monitored execution, with an audit evidence rail.</desc>
  <defs><style>.bg{fill:#07111f}.card{fill:#0f2137;stroke:#2f5578;stroke-width:2}.head{font:700 28px Arial;fill:#f4f8fc}.body{font:18px Arial;fill:#b9cbe0}.label{font:700 16px Arial;fill:#68d5c2}.arrow{stroke:#68d5c2;stroke-width:4;fill:none;marker-end:url(#m)}.rail{fill:#132b46;stroke:#f6b94a;stroke-width:2}.small{font:16px Arial;fill:#f7d590}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68d5c2"/></marker></defs>
  <rect class="bg" width="1440" height="720" rx="28"/><text class="head" x="70" y="70">Auditable research-to-portfolio architecture</text><text class="body" x="70" y="105">Each layer produces inspectable evidence; research, paper, and live states stay separate.</text>
  <g transform="translate(70 155)"><rect class="card" width="270" height="340" rx="20"/><text class="label" x="28" y="42">01 · DATA</text><text class="head" x="28" y="86">Market inputs</text><text class="body" x="28" y="132">Historical candles</text><text class="body" x="28" y="166">Timestamp checks</text><text class="body" x="28" y="200">Feature engineering</text><text class="body" x="28" y="234">Versioned snapshots</text></g><path class="arrow" d="M350 325 H405"/>
  <g transform="translate(415 155)"><rect class="card" width="270" height="340" rx="20"/><text class="label" x="28" y="42">02 · RESEARCH</text><text class="head" x="28" y="86">Reject fragility</text><text class="body" x="28" y="132">Backtests</text><text class="body" x="28" y="166">Walk-forward checks</text><text class="body" x="28" y="200">Cost stress</text><text class="body" x="28" y="234">Failure archive</text></g><path class="arrow" d="M695 325 H750"/>
  <g transform="translate(760 155)"><rect class="card" width="270" height="340" rx="20"/><text class="label" x="28" y="42">03 · PORTFOLIO</text><text class="head" x="28" y="86">Control risk</text><text class="body" x="28" y="132">Correlation review</text><text class="body" x="28" y="166">Sleeve allocation</text><text class="body" x="28" y="200">Exposure limits</text><text class="body" x="28" y="234">Drawdown brakes</text></g><path class="arrow" d="M1040 325 H1095"/>
  <g transform="translate(1105 155)"><rect class="card" width="270" height="340" rx="20"/><text class="label" x="28" y="42">04 · OPERATIONS</text><text class="head" x="28" y="86">Monitor reality</text><text class="body" x="28" y="132">Paper state</text><text class="body" x="28" y="166">Dry-run execution</text><text class="body" x="28" y="200">Readiness gates</text><text class="body" x="28" y="234">Live reconciliation</text></g>
  <g transform="translate(70 560)"><rect class="rail" width="1305" height="95" rx="18"/><text class="label" x="28" y="38">AUDIT EVIDENCE RAIL</text><text class="small" x="28" y="68">run IDs · assumptions · metrics · exceptions · decisions · owners · timestamps · weekly sign-off</text></g>
</svg>
