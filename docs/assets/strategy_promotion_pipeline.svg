<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Strategy promotion pipeline</title><desc id="desc">A gated lifecycle from hypothesis to monitored tiny-live operation, with failed gates routed to an archive.</desc>
  <defs><style>.bg{fill:#07111f}.node{fill:#10253c;stroke:#345d80;stroke-width:2}.gate{fill:#12382f;stroke:#68d5c2;stroke-width:2}.archive{fill:#3a2028;stroke:#f17485;stroke-width:2}.h{font:700 28px Arial;fill:#f4f8fc}.t{font:700 18px Arial;fill:#f4f8fc}.s{font:15px Arial;fill:#b9cbe0}.a{stroke:#68d5c2;stroke-width:4;fill:none;marker-end:url(#m)}.r{stroke:#f17485;stroke-width:3;fill:none;marker-end:url(#mr)}.pass{font:700 14px Arial;fill:#68d5c2}.fail{font:700 14px Arial;fill:#f17485}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#68d5c2"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#f17485"/></marker></defs>
  <rect class="bg" width="1440" height="720" rx="28"/><text class="h" x="70" y="68">Strategy promotion pipeline</text><text class="s" x="70" y="100">Capital access is earned through evidence. Any failed gate routes to a durable rejection record.</text>
  <g transform="translate(55 175)"><rect class="node" width="190" height="125" rx="18"/><text class="t" x="22" y="42">Hypothesis</text><text class="s" x="22" y="75">Rule + rationale</text><text class="s" x="22" y="99">Pre-set thresholds</text></g><path class="a" d="M250 238 H295"/>
  <g transform="translate(305 175)"><rect class="gate" width="190" height="125" rx="18"/><text class="t" x="22" y="42">Research gate</text><text class="s" x="22" y="75">Costs + OOS</text><text class="s" x="22" y="99">Stability + sample</text></g><path class="a" d="M500 238 H545"/>
  <g transform="translate(555 175)"><rect class="gate" width="190" height="125" rx="18"/><text class="t" x="22" y="42">Portfolio gate</text><text class="s" x="22" y="75">Risk + correlation</text><text class="s" x="22" y="99">Allocation limits</text></g><path class="a" d="M750 238 H795"/>
  <g transform="translate(805 175)"><rect class="gate" width="190" height="125" rx="18"/><text class="t" x="22" y="42">Paper gate</text><text class="s" x="22" y="75">State + behavior</text><text class="s" x="22" y="99">Monitoring window</text></g><path class="a" d="M1000 238 H1045"/>
  <g transform="translate(1055 175)"><rect class="gate" width="190" height="125" rx="18"/><text class="t" x="22" y="42">Readiness gate</text><text class="s" x="22" y="75">Dry runs + health</text><text class="s" x="22" y="99">Manual approval</text></g><path class="a" d="M1250 238 H1290"/>
  <g transform="translate(1295 175)"><rect class="node" width="110" height="125" rx="18"/><text class="t" x="15" y="42">Tiny-live</text><text class="s" x="15" y="75">Capped</text><text class="s" x="15" y="99">Reconciled</text></g>
  <text class="pass" x="650" y="145">PASS → advance one controlled state</text><path class="r" d="M400 310 V460 H675"/><path class="r" d="M650 310 V420 H675"/><path class="r" d="M900 310 V420 H765"/><path class="r" d="M1150 310 V460 H765"/>
  <g transform="translate(675 390)"><rect class="archive" width="260" height="150" rx="18"/><text class="t" x="25" y="42">Failed strategy archive</text><text class="s" x="25" y="76">Reason + evidence</text><text class="s" x="25" y="101">Decision + owner</text><text class="s" x="25" y="126">Narrow retest condition</text></g>
  <text class="fail" x="675" y="575">FAIL → archive, demote, or redesign; never silently delete</text><path class="a" d="M1405 300 V615 H205 V310"/><text class="pass" x="565" y="645">MONITOR → keep, demote, or halt as new operating evidence arrives</text>
</svg>
